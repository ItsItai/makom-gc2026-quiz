<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MAKOM Quiz booth sign</title>
<style>
  @page { size: Letter; margin: 0.5in; }
  @font-face { font-family: "Fira Sans Condensed"; font-weight: 700; src: url(../assets/fira-sans-condensed-700-latin.woff2) format("woff2"); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { color: #0E2D53; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .sheet { height: 10in; display: flex; flex-direction: column; align-items: center; }
  .stripe { width: 100%; height: 0.18in; border-radius: 0.09in; background: linear-gradient(90deg, #AB585A, #B97457, #CCB266, #027A57, #5C6AA1, #5B4D78); }
  .logo { height: 1.9in; margin-top: 0.3in; }
  h1 { font: 700 54pt/1 "Fira Sans Condensed", sans-serif; margin: 0.2in 0 0.1in; }
  .sub { font-size: 17pt; line-height: 1.35; max-width: 6.2in; margin: 0; }
  .qr { width: 4.4in; height: 4.4in; margin: 0.15in 0 0; }
  .url { font-size: 20pt; font-weight: 700; margin: 0; }
  .fine { font-size: 11pt; color: #4A5568; margin: 0.08in 0 0; }
  .cobrand { margin-top: auto; width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.15in; border-top: 1px solid #D9DCE3; padding-top: 0.12in; font-size: 11pt; color: #4A5568; }
  .cobrand img { height: 0.55in; }
</style>
</head>
<body>
<div class="sheet">
  <div class="stripe"></div>
  <img class="logo" src="makom-stacked-print.jpg" alt="MAKOM organizations">
  <h1>Play. Learn. Win.</h1>
  <p class="sub">5 quick questions about Israel's communities. Enter for a chance to win a handmade Hanukkiah.</p>
  <img class="qr" src="qr.svg" alt="QR code to the MAKOM quiz">
  <p class="url">makom-quiz.netlify.app</p>
  <p class="fine">No purchase necessary. See Official Rules online.</p>
  <div class="cobrand">
    <img src="jnf-usa-print.jpg" alt="Jewish National Fund-USA">
    <span>Global Conference for Israel 2026 · San Diego</span>
  </div>
</div>
</body>
</html>
